# Column definitions shared across models. tests/test_dictionary.py fails if a silver or gold column has no entry here.
accident_month: "First day of the month in which the loss occurred."
admin_nav_gbp: "NAV published by the fund administrator for the fund and date, GBP."
admin_src_row_id: "Source row (file:row) of the administrator NAV in custodian_cash_nav.csv."
age_band: "Client age band at the as-of date: under 40, 40-59, 60+. Replaces date of birth in the minimised view."
annual_premium: "Annual premium in GBP."
as_of_date: "Date the finding refers to."
asset_category: "Illustrative Solvency II-style asset category (not an EIOPA code)."
asset_class: "equity or bond."
asset_id: "Asset identifier in the illustrative asset listing (security_id)."
base_currency: "Fund base currency; GBP for every fund in this synthetic estate."
batch_id: "OMS delivery batch; a replayed batch carries the original id with suffix R."
candidate_trade_id: "Trade whose signed quantity equals minus the break, if one exists."
cash_gbp: "Cash balance reported by the custodian, GBP."
cause_hint: "Rule-based hint for a position break: trade_not_reflected_at_custodian, missing_at_custodian, missing_at_oms or unexplained_difference."
claim_id: "Claim identifier."
claim_type: "Damage, Theft, Liability or Water."
client_id: "Source client identifier. Personal data linkage; kept in silver only."
client_key: "Pseudonymous client key: salted hash of client_id."
client_name: "Client name (synthetic). Personal data; silver only."
close_price: "Vendor closing price in the security's currency (bonds per 100 par)."
counterparty_id: "Broker identifier."
counterparty_name: "Broker name (synthetic)."
country: "Country of issue (ISO code)."
credit_quality_step: "Illustrative credit quality step derived from rating (AAA 0, AA 1, A 2, BBB 3, BB 4, B 5)."
cumulative_return: "NAV return since the first date in the data."
currency: "Currency of the security or trade."
custodian_qty: "Quantity reported by the custodian (0 if no row)."
custodian_src_row_id: "Source row of the custodian position."
daily_return: "NAV return from the previous business day (no external flows in this synthetic estate)."
date_day: "Calendar date."
date_of_birth: "Client date of birth (synthetic). Personal data; silver only."
detail: "Human-readable description of a finding."
diff_bps: "Our NAV minus administrator NAV, in basis points of the administrator NAV."
diff_gbp: "Our NAV minus administrator NAV, GBP."
disclaimer: "Reminder that the asset listing is illustrative and synthetic."
earned_premium: "Illustrative earned premium: pro-rata days in force to the as-of date."
email: "Client e-mail (synthetic, example.invalid). Personal data; silver only."
end_date: "Policy end date."
entity_key: "Key of the affected entity (trade_id, security:date, pair:date, claim_id or id_type:value)."
episode: "Sequence number of a continuous run of break days for one fund and security."
finding_type: "Class of data-quality finding."
fund_id: "Fund identifier (F01-F04); in dq_findings, the investing fund for private-markets findings."
fund_name: "Fund name (synthetic)."
fx_is_carried: "True when the vendor sent no FX rate and the last rate was carried forward."
fx_pair: "FX pair that converts the security's currency to GBP (GBPGBP = 1)."
fx_rate: "FX rate to GBP used in the valuation."
fx_src_row_id: "Source row of the FX rate used."
id_type: "Identifier type: ISIN, SEDOL or CUSIP."
id_value: "Identifier value."
incurred: "Paid plus outstanding reserve, summed."
incurred_amount: "Paid plus reserve for the claim."
invalid_reason: "Why a claim failed validation: orphan_claim, claim_before_inception or reported_before_loss; null if valid."
is_before_inception: "True when the loss date precedes the policy start date."
is_breach: "True when |diff_bps| exceeds nav_tolerance_bps."
is_break: "True when custodian and OMS quantities differ by more than position_tolerance."
is_business_day: "True when the custodian published a NAV for the date."
is_carried: "True when the value was missing from the vendor and carried forward from the last available one."
is_current: "True for the open version of a type-2 record."
is_insurance_account: "True for the insurance general account fund."
is_orphan: "True when the claim's policy does not exist."
is_owner: "True for the earliest claim on an identifier; later claims on the same identifier are ignored."
is_reported_before_loss: "True when the report date precedes the loss date."
is_stale: "True when the close is unchanged for stale_run_length or more consecutive days."
isin: "ISIN as reported by the source system."
lei: "Legal entity identifier of the broker (synthetic)."
loss_date: "Date of loss."
loss_ratio: "Incurred divided by earned premium (illustrative)."
market_value_gbp: "Market value in GBP."
month: "Calendar month number."
mv_gbp: "Position market value in GBP: quantity x price / divisor x FX."
n_carried_prices: "Number of positions valued at a carried-forward price."
n_claims: "Number of claims."
n_policies: "Number of policies."
n_positions: "Number of positions in the fund NAV."
n_source_copies: "How many times the source system delivered this record (greater than 1 means replay)."
n_stale_prices: "Number of positions valued at a stale price."
n_trades: "Number of trades behind a position."
name: "Name (synthetic)."
nav_gbp: "Fund NAV from our book: OMS quantities x vendor prices x vendor FX plus custodian cash, GBP."
notional_gbp: "Trade notional in GBP at trade-date FX."
oms_qty: "Settled quantity derived from OMS trades (settle date on or before the position date)."
paid: "Paid amount, summed."
paid_amount: "Paid amount for the claim, GBP."
pair: "Currency pair quoted to GBP (EURGBP or USDGBP)."
policy_id: "Policy identifier."
position_date: "Business date of the position or NAV."
postcode: "Full postcode (synthetic). Personal data; silver only."
postcode_district: "Outward part of the postcode; the only location detail exposed beyond region."
premium_band: "Premium band: under 500, 500-999, 1000+."
price: "Price used in the valuation (trade price on trades)."
price_basis: "unit (equities) or per100 (bonds quoted per 100 par)."
price_date: "Date of a vendor price."
price_divisor: "1 for unit prices, 100 for per-100 bond prices."
price_is_carried: "True when the valuation price was carried forward."
price_is_stale: "True when the valuation price is flagged stale."
price_src_row_id: "Source row of the price used."
product: "Insurance product line."
qty_diff: "Custodian quantity minus OMS quantity."
quantity: "Quantity (units for equities, nominal for bonds)."
rate: "FX rate to GBP."
rate_date: "Date of a vendor FX rate."
rating: "Credit rating (bonds)."
received_at: "When the OMS delivered the record."
region: "UK region of the policy; basis of row-level security."
reported_date: "Date the claim was reported."
reserve: "Outstanding reserve, summed."
reserve_amount: "Outstanding reserve for the claim, GBP."
sector: "Industry sector of the issuer (equities); Fixed income for bonds."
securities_mv_gbp: "Sum of position market values for the fund and date, GBP."
security_id: "Internal security identifier (S001-S060); in dq_findings, also the private fund (PM01-PM08) a finding refers to."
security_sk: "Surrogate key of a security version (type 2)."
sedol: "SEDOL as reported by the source system."
settle_date: "Settlement date."
settle_lag: "Settlement lag in business days."
severity: "warn for findings that are reported but do not stop the build."
side: "BUY or SELL."
signed_qty: "Quantity with sign: positive for buys, negative for sells."
src_row_id: "Source row (file:row) the record was built from."
stale_fx_day: "True when an FX rate was stale on the date."
start_date: "Policy start date."
status: "Claim status (Open or Closed)."
sum_insured: "Sum insured in GBP."
trade_date: "Trade date."
trade_id: "Trade identifier from the OMS."
trade_ids: "Comma-separated trades that built the position."
trade_src_row_ids: "Comma-separated source rows of those trades."
valid_from: "First day a version of a record is valid."
valid_to: "Last day a version is valid (inclusive); 9999-12-31 if open."
vendor_ts: "Timestamp the vendor published the record."
weight: "Share of the insurance account's market value."
written_premium: "Sum of annual premiums."
year: "Calendar year."
# ---- private markets ----------------------------------------------------------------------------------------------------
amount: "Notice amount in fund currency: the sum of its line items (positive; flow_type or notice_type gives the direction)."
buyer_investor_id: "fundlake fund that bought the LP interest on the secondary market."
calls_since: "Capital calls with value dates after the last statement's period end, up to the reporting date."
commitment: "Commitment to the private fund in fund currency (the transferred commitment for a secondary interest)."
commitment_amount: "Committed capital in fund currency."
commitment_date: "Date the commitment was made (closing date for a secondary purchase)."
commitment_gbp: "Commitments converted to GBP at the reporting-date rate."
commitment_id: "Commitment identifier."
component: "Notice line type: investment, management_fee, fund_expenses, income, return_of_capital or realised_gain."
contributions_diff: "GP contributions to date minus ours (notices plus inherited); positive means a call is missing from our feed."
distributions: "Distributions received in fund currency (after the transfer date for a secondary interest)."
distributions_diff: "GP distributions to date minus ours (notices plus inherited)."
distributions_since: "Distributions with value dates after the last statement's period end, up to the reporting date."
dpi: "Distributions to paid-in: distributions divided by paid-in."
expected_contributions: "Our contributions to the statement date: notices plus, for a secondary, inherited paid-in."
expected_distributions: "Our distributions to the statement date: notices plus, for a secondary, inherited distributions."
fees: "Management fees and fund expenses within a capital call."
flow_type: "contribution, distribution or secondary_purchase."
fx_rate_to_gbp: "Rate converting the fund currency to GBP at the reporting date (vendor FX)."
gp_basis_tvpi: "For a secondary interest, TVPI on the GP's figures, which inherit the seller's contributions and distributions."
gp_contributions_to_date: "Cumulative contributions as the GP's capital account records them (inherited history included)."
gp_distributions_to_date: "Cumulative distributions as the GP's capital account records them (inherited history included)."
header_amount: "Total on the notice header as delivered (may disagree with its lines or carry a wrong sign)."
income: "Income distributed (rent, interest, dividends) within a distribution."
inherited_distributions: "Seller's distributions to the transfer date, carried in the GP's capital account."
inherited_paid_in: "Seller's contributions to the transfer date, carried in the GP's capital account."
investment: "Capital called for investments within a capital call."
investor_id: "fundlake fund investing as limited partner (F03, F04); other values are notices addressed to someone else."
irr: "Since-inception internal rate of return (XIRR convention, 365-day year), reporting-date NAV as the final inflow."
irr_found: "True when the IRR search found a sign change of the NPV in the search range (-95% to +200%)."
is_lines_mismatch: "True when the notice header total differs from the sum of its lines; the lines are used."
is_reconciled: "True when every GP capital-account statement agrees with our notices to the penny."
is_rolled_forward: "True when the reporting-date NAV includes cashflows after the last statement."
is_sign_corrected: "True when a negative header was corrected because its positive lines sum to its absolute value."
is_unknown_investor: "True when the notice is addressed to an investor with no commitment to that fund; excluded."
last_reported_nav: "NAV on the latest statement received by the reporting date."
last_statement_date: "Period end of the latest statement received by the reporting date."
line_no: "Line number within a notice."
n_findings: "Data-quality findings on the commitment."
n_funds: "Number of private-fund commitments."
n_lines: "Number of line items on a notice."
n_unreconciled: "Commitments whose capital account does not reconcile."
nav: "Net asset value of the LP interest in fund currency."
nav_asof: "NAV at the reporting date: latest statement NAV plus later calls minus later distributions."
nav_source: "reported (from a statement) or rolled_forward (statement missing; previous NAV plus cashflows)."
notice_date: "Date the GP issued the notice."
notice_id: "Notice identifier (CN = capital call, DN = distribution)."
notice_type: "capital_call or distribution."
origin: "primary (committed at fund raising) or secondary (bought from another LP)."
paid_in: "Capital paid in by the investor: calls, plus the purchase price for a secondary interest."
period_end: "Quarter end a statement or NAV refers to."
pm_fund_id: "Private fund identifier (PM01-PM08)."
purchase_price: "Price paid for a secondary interest: discount to reference NAV, adjusted for cashflows to closing."
realised_gain: "Realised gain distributed within a distribution."
received_date: "Date the statement was delivered."
reference_date: "Date of the NAV a secondary price was agreed on."
reference_nav: "NAV of the interest at the reference date."
return_of_capital: "Capital returned within a distribution."
rvpi: "Residual value to paid-in: reporting-date NAV divided by paid-in."
seller_name: "Seller of a secondary interest (synthetic)."
signed_amount: "Cashflow from the investor's side: contributions and purchases negative, distributions positive."
source_id: "Notice or transfer identifier the cashflow came from."
statement_id: "Capital-account statement identifier."
statement_lag_days: "Days between the latest statement's period end and the reporting date."
strategy: "Private-fund strategy: buyout, growth, real_estate, infrastructure or secondaries."
transfer_date: "Closing date of a secondary purchase."
transfer_id: "Secondary transfer identifier."
transferred_commitment: "Commitment transferred to the buyer."
tvpi: "Total value to paid-in: (distributions + reporting-date NAV) divided by paid-in."
unfunded: "Commitment not yet called (negative when calls exceed the commitment)."
unfunded_at_transfer: "Commitment not yet called at the transfer date."
unfunded_gbp: "Unfunded commitment in GBP at the reporting-date rate."
valuation_change: "NAV change not explained by the GP's own contribution and distribution figures; zero means no revaluation."
value_date: "Date the cash moves."
vintage: "Year of the private fund's first close."
