fundlake:
  target: "{{ env_var('FUNDLAKE_TARGET', 'duckdb') }}"
  outputs:
    duckdb:
      type: duckdb
      path: "{{ env_var('FUNDLAKE_DB', '../data/fundlake.duckdb') }}"
      threads: 4
    snowflake:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT', 'unset') }}"
      user: "{{ env_var('SNOWFLAKE_USER', 'unset') }}"
      password: "{{ env_var('SNOWFLAKE_PASSWORD', 'unset') }}"
      role: "{{ env_var('SNOWFLAKE_ROLE', 'FUNDLAKE_ROLE') }}"
      database: "{{ env_var('SNOWFLAKE_DATABASE', 'FUNDLAKE') }}"
      warehouse: "{{ env_var('SNOWFLAKE_WAREHOUSE', 'FUNDLAKE_WH') }}"
      schema: PUBLIC
      threads: 4
